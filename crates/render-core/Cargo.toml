[package]
name = "render-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
comrak = { version = "0.29", features = ["syntect"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
walkdir = "2"
anyhow = "1"
ignore = "0.4"
percent-encoding = "2.3"

[dev-dependencies]
proptest = "=1.12.0"
